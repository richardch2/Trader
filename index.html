<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small Cap Tracker</title>
  <meta name="description" content="Small-cap ETFs vs the S&P 500, updated every trading day.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Small Caps">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <nav class="bar" aria-label="Main">
    <div class="bar-inner">
      <a class="brand" id="brand" href="#overview"></a>
      <div class="menu" id="menu"></div>
      <div class="account" id="account"></div>
      <button class="link-btn install-btn" id="install" hidden>Install app</button>
    </div>
    <div class="tape" id="tape" aria-label="Trending tickers" hidden></div>
  </nav>
  <main class="wrap">
    <header class="top">
      <div>
        <h1 id="headline" class="headline">Loading prices…</h1>
      </div>
      <div class="top-right">
        <p id="updated" class="updated"></p>
        <div class="ranges" id="ranges" role="group" aria-label="Period"></div>
      </div>
    </header>

    <section id="empty" class="empty" hidden>
      <h2>No price data yet</h2>
      <p>Add your Alpha Vantage key as the repository secret <code>ALPHAVANTAGE_API_KEY</code>, then run the
        <b>Update data</b> workflow from the Actions tab. The page fills in once it finishes.</p>
    </section>

    <!-- The current page's cards (config.json → pages) are mounted here, in order -->
    <div id="cards" class="cards" hidden></div>

    <footer class="foot">
      Prices from Yahoo Finance, refreshed after each US market close. Not investment advice.
      <span id="failures"></span>
    </footer>
  </main>
  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
