name: Update data

on:
  schedule:
    # 6:20pm US Eastern (22:20 UTC in summer, 23:20 in winter), Mon–Fri
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these fetchers (space-separated, e.g. smallcaps). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Yahoo Finance library
        run: pip install --quiet yfinance

      - name: Fetch data
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: python scripts/update.py $ONLY

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
